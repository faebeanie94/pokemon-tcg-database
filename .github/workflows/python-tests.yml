name: Python tests

on:
  push:
    paths:
      - "src/pokedb/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/pokedb/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/python-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
