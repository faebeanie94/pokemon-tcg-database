name: Update card database

# Refreshes the workbook and CSV exports from the public sources. Runs weekly,
# and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild the database and exports
        run: PYTHONPATH=src python -m pokedb update

      - name: Upload the workbook as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-tcg-card-database
          path: exports/
          retention-days: 90

      - name: Commit the refreshed exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports
          if git diff --cached --quiet; then
            echo "No card data changed."
          else
            git commit -m "Refresh card database exports"
            git push
          fi
