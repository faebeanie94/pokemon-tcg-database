services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Keeps the built database across restarts so a new container does not
      # have to re-download everything before it can serve traffic.
      - pokedb-data:/data
      - ./exports:/app/exports
    environment:
      POKEDB_REFRESH_HOURS: "24"
      # POKEDB_ADMIN_TOKEN: set this to enable POST /v1/admin/refresh
      # POKEDB_CORS_ORIGINS: https://your-grading-site.example
    restart: unless-stopped

volumes:
  pokedb-data:
