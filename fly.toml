# fly.toml app configuration file generated for the Next.js operator console.
# See docs/DEPLOY_FLY.md for volume seeding and first deploy.

app = "tfg-tcg-database"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.web"

[env]
  POKEDB_DB = "/data/pokemon_tcg.sqlite"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "1m"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2

[mounts]
  source = "pokedb_data"
  destination = "/data"
  initial_size = "3gb"
